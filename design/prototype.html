<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meal Note — Instructor Review (Prototype)</title><style>
:root{--bg:#f8f7f5;--surface:#fff;--primary:#7354b4;--soft:#eee8f9;--text:#252333;--muted:#706b7c;--line:#e8e4ec;--green:#207a5a}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Pretendard,'Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;color:var(--text)}button,textarea,input{font:inherit}button{cursor:pointer}.app{max-width:510px;margin:0 auto;min-height:100vh;padding:28px 20px 70px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.16em;color:var(--primary)}h1{margin:6px 0 4px;font-size:28px;letter-spacing:-.04em}.sub{color:var(--muted);font-size:13px;margin:0}.demo{display:inline-flex;margin:16px 0 0;background:#fff0dc;color:#8a5a17;border-radius:99px;padding:7px 11px;font-size:11px;font-weight:700}.datebar{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:18px;margin:24px 0 22px;padding:12px}.datebar button{border:0;background:var(--soft);color:var(--primary);height:42px;width:42px;border-radius:12px;font-size:23px}.datebar input{border:0;color:var(--text);font-weight:750;text-align:center;background:transparent;max-width:155px}.section{display:flex;justify-content:space-between;align-items:center;margin:0 0 12px}.section h2{font-size:18px;margin:0}.count{font-size:12px;color:var(--primary);background:var(--soft);padding:6px 10px;border-radius:99px;font-weight:750}.meal{display:flex;gap:15px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:15px;margin:0 0 12px;box-shadow:0 5px 24px #382e4c07}.photo{width:92px;height:92px;flex:none;border-radius:14px;background:linear-gradient(145deg,#f6e4bd,#c4d5bd);display:grid;place-items:center;font-size:42px}.meal:nth-child(3) .photo{background:linear-gradient(145deg,#e8c9b2,#e4e2c2)}.meal .meta{font-size:12px;color:var(--primary);font-weight:800}.meal h3{font-size:16px;line-height:1.45;margin:6px 0}.meal p{font-size:12px;color:var(--muted);margin:5px 0;line-height:1.6}.duration{font-size:11px;font-weight:750;color:var(--green);background:#eaf6ef;border-radius:99px;padding:4px 8px;display:inline-block}.review{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;margin-top:26px}.review h2{font-size:18px;margin:0 0 7px}.review p{font-size:12px;color:var(--muted);line-height:1.6;margin:0 0 14px}textarea{width:100%;resize:vertical;min-height:150px;border:1px solid var(--line);border-radius:13px;background:#fcfbfd;padding:14px;color:var(--text);line-height:1.65;outline-color:var(--primary)}.footer{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:12px}.status{font-size:12px;color:var(--muted)}.save{border:0;border-radius:13px;background:var(--primary);color:#fff;font-weight:800;padding:14px 24px;min-height:46px}.save:disabled{background:#bbb5c7;cursor:not-allowed}.empty{background:#fff;border:1px dashed var(--line);padding:35px 18px;text-align:center;border-radius:20px;color:var(--muted);font-size:13px}.empty strong{display:block;color:var(--text);font-size:17px;margin:8px 0}.statebar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.statebar button{font-size:11px;border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:8px;padding:7px 9px}.statebar button.active{background:var(--soft);border-color:#cab9e8;color:var(--primary)}.warning{color:#b64242;font-size:12px;margin:12px 0 0}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:370px){.app{padding:22px 12px 55px}.photo{width:76px;height:76px}.meal{gap:10px;padding:12px}.meal h3{font-size:14px}}
</style></head><body><main class="app"><div class="eyebrow">MEAL NOTE</div><h1>하루 식단 리뷰</h1><p class="sub">공유된 식단을 확인하고 하루 총평을 남겨주세요.</p><div class="demo">● 인터랙티브 디자인 시안 · 가상 데이터 · Notion 미연결</div><div class="datebar"><button aria-label="이전 날짜" id="prev">‹</button><label><span class="sr">리뷰 날짜</span><input type="date" id="date" value="2026-11-15"></label><button aria-label="다음 날짜" id="next">›</button></div><div class="section"><h2>공유된 식단</h2><span class="count" id="count">2건</span></div><div id="meals"></div><section class="review"><h2>오늘의 총평</h2><p>하루 식단 전체에 대한 의견을 한 번만 작성합니다. 식사별 개별 리뷰는 제공하지 않습니다.</p><label for="feedback" class="sr">강사 총평</label><textarea id="feedback" placeholder="식사 구성, 개선할 점, 다음 식사에 대한 제안을 작성해 주세요."></textarea><div class="footer"><span class="status" id="status" aria-live="polite">미작성</span><button class="save" id="save">총평 저장</button></div><div class="warning" id="error" role="alert"></div></section><div class="statebar" aria-label="시안 상태 미리보기"><button id="normal" class="active">기본 화면</button><button id="none">식단 없음</button><button id="failed">저장 오류</button><button id="denied">링크 만료</button></div></main><script>
// Prototype only. No network, cookies, storage, or Notion writes.
const data={'2026-11-15':[{type:'점심',time:'11:28~11:53',duration:'25분',food:'항정국밥 · 항정수육 · 순대 1알',emoji:'🍲',note:'공유 메모 없음'}],'2026-11-14':[{type:'저녁',time:'20:30~21:25',duration:'55분',food:'모듬소금구이 · 볶음밥',emoji:'🥩',note:'공유 메모 없음'}]};
// These are fictional visual samples, NOT actual records. Dates/foods echo examples solely for layout demonstration.
const date=document.querySelector('#date'),meals=document.querySelector('#meals'),count=document.querySelector('#count'),feedback=document.querySelector('#feedback'),save=document.querySelector('#save'),status=document.querySelector('#status'),error=document.querySelector('#error');let mode='normal';const drafts={};function render(){const d=date.value,items=mode==='none'?[]:(data[d]||[]);count.textContent=items.length+'건';meals.innerHTML=mode==='denied'?'<div class="empty"><strong>접근할 수 없습니다</strong>비밀 링크가 만료되었거나 폐기되었습니다.</div>':items.length?items.map(m=>`<article class="meal"><div class="photo" aria-hidden="true">${m.emoji}</div><div><span class="meta">${m.type} · ${m.time}</span><h3>${m.food}</h3><span class="duration">식사 ${m.duration}</span><p>${m.note}</p></div></article>`).join(''):'<div class="empty"><div style="font-size:28px">🍽️</div><strong>공유된 식단이 없습니다</strong>해당 날짜에 공유된 식단 기록이 없습니다.</div>';feedback.value=drafts[d]||'';feedback.disabled=mode==='denied';save.disabled=mode==='denied'||(!items.length&&!drafts[d]);status.textContent=mode==='denied'?'접근 제한':'미작성';error.textContent='';document.querySelectorAll('.statebar button').forEach(b=>b.classList.toggle('active',b.id===mode))}date.addEventListener('change',render);for(const [id,delta] of [['prev',-1],['next',1]])document.getElementById(id).onclick=()=>{const [y,m,d]=date.value.split('-').map(Number),dt=new Date(Date.UTC(y,m-1,d+delta));date.value=dt.toISOString().slice(0,10);render()};feedback.addEventListener('input',()=>{drafts[date.value]=feedback.value;save.disabled=mode==='denied'||!feedback.value.trim()||(!data[date.value]&&!drafts[date.value]);status.textContent='작성 중'});save.onclick=()=>{if(mode==='failed'){error.textContent='저장에 실패했습니다. 입력 내용은 유지됩니다. (시안 예시)';status.textContent='저장 실패';return}if(!feedback.value.trim())return;status.textContent='저장 완료 (시안 내부 상태만 변경)';error.textContent=''};for(const id of ['normal','none','failed','denied'])document.getElementById(id).onclick=()=>{mode=id;render()};render();
</script></body></html>
